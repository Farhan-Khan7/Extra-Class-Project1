<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homely</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <main>
        <section id="section-1">
            <nav>
                <div class="logo">
                    <h3><i class="ri-home-smile-2-fill"></i></h3>
                    <h2>homely</h2>
                </div>
                <div class="nav-links">
                    <a href="#">Homepage</a>
                    <a href="#">MegaMenu</a>
                    <a href="#">About</a>
                    <a href="#">Rooms</a>
                    <a href="#">Services</a>
                    <a href="#">Pages <i class="ri-arrow-drop-down-line"></i></a>
                </div>
                <div class="btn">
                    <button>Log in</button>
                    <button>Contact</button>
                </div>
            </nav>
            <!-- Navbar complete -->


            <div id="hero">

                <div class="content">
                    <div class="rating">
                        <i class="ri-star-fill"></i>
                        <div>
                            <h5>4.5 Rating</h5>
                            <p>by New York Times</p>
                        </div>
                    </div>
                    <h1>
                        Find out the Best stay.
                    </h1>
                    <p class="description">
                        Your content goes here. Edit or remove this text inline or in the
                        module content settings. You can also style every aspect of this
                        content in the module design.
                    </p>

                    <div class="buttons">
                        <button class="login-btn">Log in</button>
                        <button class="primary-btn"><i class="ri-arrow-right-line"></i>Get Started</button>
                    </div>

                    <!-- BRANDS -->
                    <div class="brands">
                        <p>Trusted by</p>
                        <div class="brand-logos">
                            <span><img src="assets/samsonite.png" alt=""></span>
                            <span><img src="assets/airbnb.png" alt=""></span>
                            <span><img src="assets/Emirates-logo.png" alt=""></span>
                            <span><img src="assets/United-travel.png" alt=""></span>
                        </div>
                    </div>
                </div>
                <!-- RIGHT IMAGE -->
                <div class="background-img">
                    <img src="assets/hero-section-image.png" alt="">
                </div>

            </div>

            <!-- Hero Section -->


            
        </section>


    </main>


</body>

</html>
